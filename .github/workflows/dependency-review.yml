name: Dependency Review

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Validate vulnerability exceptions
        id: exceptions
        run: npm run security:validate-exceptions

      - name: Export approved advisory exceptions
        id: approved-exceptions
        run: node -e "const p=require('./.github/security/vulnerability-exceptions.json'); console.log('advisories='+p.exceptions.map((e)=>e.advisory).join(','))" >> "$GITHUB_OUTPUT"

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          allow-ghsas: ${{ steps.approved-exceptions.outputs.advisories }}
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
          show-openssf-scorecard: false
          show-patched-versions: true
