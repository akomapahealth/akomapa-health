name: Deploy dev staging to Vercel

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: vercel-staging-dev
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Build and deploy staging
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_STAGING_DOMAIN: ${{ vars.VERCEL_STAGING_DOMAIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel preview environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel preview artifact
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Vercel staging artifact
        id: deploy
        run: |
          deployment_url="$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Deployed staging preview: $deployment_url"

      - name: Alias staging domain
        if: ${{ vars.VERCEL_STAGING_DOMAIN != '' }}
        run: |
          vercel alias set "${{ steps.deploy.outputs.deployment_url }}" "$VERCEL_STAGING_DOMAIN" --token=${{ secrets.VERCEL_TOKEN }}
          echo "Aliased staging preview to: https://$VERCEL_STAGING_DOMAIN"
