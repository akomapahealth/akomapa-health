name: Lint, typecheck, build, and E2E

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      # npm 11 uses the bulk advisory API without the retired quick-audit fallback.
      - name: Pin audit-capable npm
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Install Playwright browsers
        run: |
          if timeout 8m npx playwright install --with-deps; then
            exit 0
          fi
          echo "Playwright OS dependency install timed out or failed; installing browsers only"
          npx playwright install

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Verify React Server Components security patch
        run: npm run security:verify-rsc-patch

      - name: Audit production dependencies
        run: npm run security:audit:prod -- --audit-level=low

      - name: Build application
        run: npm run build
        env:
          CI: true
          FILLOUT_API_KEY: "ci-intake-secret-must-not-leak"
          RESEND_API_KEY: "ci-notification-secret-must-not-leak"
          NEXT_PUBLIC_IMMERSION_INTAKE_ENABLED: "true"
          NEXT_PUBLIC_IMMERSION_FILLOUT_FORM_ID: "ciTestForm193"
          NEXT_PUBLIC_IMMERSION_FILLOUT_FORM_URL: "https://forms.fillout.com/t/ciTestForm193"
          NEXT_PUBLIC_GIVEBUTTER_DONATIONS_ENABLED: "true"
          NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT: https://ik.imagekit.io/akomapa
          NEXT_PUBLIC_IMAGEKIT_PUBLIC_KEY: public_ci_placeholder

      - name: Verify intake secrets are absent from client bundles
        run: npm run security:verify-intake-client-bundle
        env:
          INTAKE_CLIENT_SECRET_SENTINELS: "ci-intake-secret-must-not-leak,ci-notification-secret-must-not-leak"

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          NEXT_PUBLIC_GIVEBUTTER_DONATIONS_ENABLED: "true"
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
        continue-on-error: false
        timeout-minutes: 20

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          retention-days: 3
